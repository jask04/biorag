name: Keepalive

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep Qdrant and Hugging Face Space active
        env:
          HF_SPACE_URL: https://jask04-biorag.hf.space
          KEEPALIVE_RETRIES: "6"
          KEEPALIVE_RETRY_DELAY_SECONDS: "30"
          KEEPALIVE_TIMEOUT_SECONDS: "30"
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
        run: python scripts/keepalive.py
