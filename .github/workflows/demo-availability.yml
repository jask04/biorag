name: Demo Availability

on:
  schedule:
    # Free cpu-basic Hugging Face Spaces pause after 48h of inactivity.
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Qdrant cluster
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
        run: |
          test -n "$QDRANT_URL"
          test -n "$QDRANT_API_KEY"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              --header "api-key: ${QDRANT_API_KEY}" \
              "${QDRANT_URL%/}/collections" \
              > /dev/null; then
              echo "Qdrant cluster is reachable."
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Qdrant cluster not ready yet; retrying (${attempt}/12)."
              sleep 30
            fi
          done

          echo "Qdrant cluster did not become reachable after retries."
          exit 1

      - name: Check Hugging Face Space
        if: ${{ always() }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              https://jask04-biorag.hf.space \
              > /dev/null; then
              echo "Hugging Face Space is reachable."
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Hugging Face Space not ready yet; retrying (${attempt}/12)."
              sleep 30
            fi
          done

          echo "Hugging Face Space did not become reachable after retries."
          exit 1
