[project]
name = "biorag"
version = "0.1.0"
description = "Evaluation-first biomedical RAG with a benchmarked retrieval pipeline."
readme = "README.md"
authors = [
    { name = "jask04", email = "jasksingh2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
