[project]
name = "biorag"
version = "0.1.0"
description = "Evaluation-first biomedical RAG with a benchmarked retrieval pipeline."
readme = "README.md"
authors = [
    { name = "jask04", email = "jasksingh2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "google-genai>=2.7.0",
    "langchain-community<0.4",
    "langchain-google-genai>=4.2.4",
    "numpy>=2.4.6",
    "pydantic-settings>=2.5",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.58.0",
]

[project.scripts]
ask = "biorag.cli:ask"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pandas-stubs>=3.0.3.260530",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "app.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "datasets", "datasets.*",
    "sentence_transformers", "sentence_transformers.*",
    "rank_bm25", "rank_bm25.*",
    "ragas", "ragas.*",
    "langchain_google_genai", "langchain_google_genai.*",
    "langchain_community", "langchain_community.*",
    "langchain_core", "langchain_core.*",
    "langchain", "langchain.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
